plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace = "com.jointag.proximity.examples.empty"
    // The SDK is compiled against API 36, so anything depending on it has to compile
    // against 36 or later.
    compileSdk 36
    defaultConfig {
        applicationId "com.jointag.proximity.examples.empty"
        minSdk 21
        targetSdk 36
        versionCode 3
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // The SDK is built for the JVM 17 target; a module on Java 8 cannot read its classes.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    flavorDimensions = ["service"]
    // Different product flavour based on which service platform you want to use
    // for location and advertising
    productFlavors {
        // Google Play Services version
        gms {
            dimension = "service"
        }
        // Huawei Mobile Services version
        huawei {
            dimension = "service"
            applicationIdSuffix = ".hms"
        }
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.androidx.preference
    implementation libs.material
    implementation libs.cmp.sdk

    // For Google Play Services
    gmsImplementation libs.proximitysdk

    // For Huawei Mobile Services
    huaweiImplementation libs.hms.ads.identifier
    huaweiImplementation libs.hms.location
    huaweiImplementation(libs.proximitysdk) {
        exclude group: "com.google.android.gms"
    }
}
