[versions]
activity = "1.11.0"
agp = "8.13.0"
appcompat = "1.7.1"
cmpSdk = "2.1.0"
constraintlayout = "2.1.4"
coreKtx = "1.17.0"
hms-ads = "3.4.41.302"
hms-location = "4.0.0.300"
kotlin = "2.2.0"
material = "1.13.0"
preference = "1.2.1"
proximitysdk = "1.20.0-rc1"

[libraries]
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "preference" }
cmp-sdk = { module = "com.next14.cmp:cmp-sdk", version.ref = "cmpSdk" }
hms-ads-identifier = { module = "com.huawei.hms:ads-identifier", version.ref = "hms-ads" }
hms-location = { module = "com.huawei.hms:location", version.ref = "hms-location" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
proximitysdk = { module = "com.jointag:proximitysdk", version.ref = "proximitysdk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

